name: Radar Licitaciones Multi-Fuente Sync

on:
  schedule:
    # Lunes a Viernes a las 12:00 UTC (06:00 AM hora del centro de México)
    - cron: '0 12 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Ejecutar en modo de prueba (dry-run, no guarda cambios en Git)'
        required: false
        default: false
        type: boolean
      create_pr:
        description: 'Abrir un Pull Request hacia master en lugar de hacer commit directo'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

env:
  NODE_VERSION: '24.x'

jobs:
  sync:
    name: Sincronizar Licitaciones Federales y Estatales
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar sincronización multi-fuente de licitaciones
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm run sync:all:check
          else
            npm run sync:all
          fi

      - name: Validar tipado y pruebas unitarias
        run: |
          npx tsc -b --noEmit
          npm run test:run

      - name: Evaluar cambios en los datasets
        id: git_diff
        run: |
          if git diff --quiet src/data/*-licitaciones.json; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "Sin cambios detectados en los datasets de licitaciones."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Se detectaron cambios en los datasets de licitaciones."
          fi

      - name: Guardar cambios y sincronizar
        if: steps.git_diff.outputs.has_changes == 'true' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date +'%Y-%m-%d')
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/*-licitaciones.json

          IS_SCHEDULE="${{ github.event_name == 'schedule' }}"
          CREATE_PR="${{ github.event.inputs.create_pr }}"

          if [ "$IS_SCHEDULE" = "true" ] || [ "$CREATE_PR" != "false" ]; then
            BRANCH_NAME="radar-sync-${TODAY}"
            git checkout -b "$BRANCH_NAME"
            git commit -m "chore(radar): sincronización automática multi-fuente [${TODAY}]"
            git push origin "$BRANCH_NAME" --force
            if gh pr view "$BRANCH_NAME" > /dev/null 2>&1; then
              echo "Pull request para $BRANCH_NAME ya existe. Rama actualizada."
            else
              gh pr create \
                --base master \
                --head "$BRANCH_NAME" \
                --title "chore(radar): sincronización automática multi-fuente [${TODAY}]" \
                --body "Actualización automática periódica del feed de licitaciones públicas federales y estatales (CompraNet, CDMX, Jalisco, Nuevo León, Yucatán) y ciclo de vida de procedimientos en el Radar de Lex Corporativo hacia producción (master)."
            fi
          else
            git commit -m "chore(radar): sincronización automática multi-fuente [${TODAY}]"
            git push origin master
          fi
